# Traducción de los mensajes propios de Devise (no cubiertos por la gema
# rails-i18n, que solo traduce mensajes de validación de ActiveRecord). La
# mayoría de estos mensajes no se ven en el sitio porque los flashes
# automáticos de Devise están desactivados (ver ApplicationController), pero
# el asunto de los emails (ej. "Instrucciones para recuperar tu contraseña")
# sí se ve siempre, así que tiene que estar en español.

es:
  devise:
    confirmations:
      confirmed: "Tu email fue confirmado correctamente."
      send_instructions: "Vas a recibir un email con instrucciones para confirmar tu email en unos minutos."
      send_paranoid_instructions: "Si tu email existe en nuestra base de datos, vas a recibir un email con instrucciones para confirmarlo en unos minutos."
    failure:
      already_authenticated: "Ya iniciaste sesión."
      inactive: "Tu cuenta todavía no está activada."
      invalid: "%{authentication_keys} o contraseña inválidos."
      locked: "Tu cuenta está bloqueada."
      last_attempt: "Te queda un intento más antes de que se bloquee tu cuenta."
      not_found_in_database: "%{authentication_keys} o contraseña inválidos."
      timeout: "Tu sesión expiró. Inicia sesión de nuevo para continuar."
      unauthenticated: "Necesitas iniciar sesión o registrarte antes de continuar."
      unconfirmed: "Tienes que confirmar tu email antes de continuar."
    mailer:
      confirmation_instructions:
        subject: "Instrucciones de confirmación"
      reset_password_instructions:
        subject: "Instrucciones para recuperar tu contraseña"
      unlock_instructions:
        subject: "Instrucciones para desbloquear tu cuenta"
      email_changed:
        subject: "Tu email fue cambiado"
      password_change:
        subject: "Tu contraseña fue cambiada"
    omniauth_callbacks:
      failure: "No pudimos autenticarte desde %{kind} porque \"%{reason}\"."
      success: "Autenticado correctamente desde tu cuenta de %{kind}."
    passwords:
      no_token: "No puedes acceder a esta página sin venir desde un email de recuperación de contraseña. Si vienes desde ese email, revisa que hayas usado el link completo."
      send_instructions: "Vas a recibir un email con instrucciones para recuperar tu contraseña en unos minutos."
      send_paranoid_instructions: "Si tu email existe en nuestra base de datos, vas a recibir un link de recuperación de contraseña en unos minutos."
      updated: "Tu contraseña fue cambiada correctamente. Ya iniciaste sesión."
      updated_not_active: "Tu contraseña fue cambiada correctamente."
    registrations:
      destroyed: "¡Chao! Tu cuenta fue cancelada correctamente. Esperamos verte pronto de nuevo."
      signed_up: "¡Bienvenido/a! Te registraste correctamente."
      signed_up_but_inactive: "Te registraste correctamente. Sin embargo, no pudimos iniciar tu sesión porque tu cuenta todavía no está activada."
      signed_up_but_locked: "Te registraste correctamente. Sin embargo, no pudimos iniciar tu sesión porque tu cuenta está bloqueada."
      signed_up_but_unconfirmed: "Te enviamos un mensaje con un link de confirmación a tu email. Sigue el link para activar tu cuenta."
      update_needs_confirmation: "Actualizaste tu cuenta correctamente, pero necesitamos verificar tu nuevo email. Revisa tu correo y sigue el link de confirmación."
      updated: "Tu cuenta fue actualizada correctamente."
      updated_but_not_signed_in: "Tu cuenta fue actualizada correctamente, pero como cambiaste tu contraseña, tienes que iniciar sesión de nuevo."
    sessions:
      signed_in: "Iniciaste sesión correctamente."
      signed_out: "Cerraste sesión correctamente."
      already_signed_out: "Cerraste sesión correctamente."
    unlocks:
      send_instructions: "Vas a recibir un email con instrucciones para desbloquear tu cuenta en unos minutos."
      send_paranoid_instructions: "Si tu cuenta existe, vas a recibir un email con instrucciones para desbloquearla en unos minutos."
      unlocked: "Tu cuenta fue desbloqueada correctamente. Inicia sesión para continuar."
  errors:
    messages:
      already_confirmed: "ya estaba confirmado, intenta iniciar sesión"
      confirmation_period_expired: "necesita confirmarse dentro de %{period}, por favor solicita uno nuevo"
      expired: "expiró, por favor solicita uno nuevo"
      not_found: "no encontrado"
      not_locked: "no estaba bloqueado"
      not_saved:
        one: "Se encontró 1 error al intentar guardar este %{resource}:"
        other: "Se encontraron %{count} errores al intentar guardar este %{resource}:"
